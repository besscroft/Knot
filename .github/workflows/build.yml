name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 通过 tag（v*）触发：双平台矩阵构建 Windows exe + NSIS 安装包、macOS .app + DMG，
# 再由 release job 汇总发布到 GitHub Release。版本号从 tag 注入 mygo.config.ts
# （tag 是唯一真源，安装包/DMG 的文件名随之对齐）。workflow_dispatch 手动触发时
# 只构建出 artifacts 供检查，不发布。
# 签名/公证需要证书与密钥，配置好 secrets 后自动启用。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platforms: windows/amd64,windows/arm64
            artifact: knot-windows
          - os: macos-latest
            platforms: darwin/universal
            artifact: knot-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # CI 是全新环境，三处依赖都要装：根（mygo-cli）、extension（wxt）、
      # frontend（vite 等，mygo build 的 buildCommand 会用到）。三处 bun.lock
      # 均已提交，CI 下 bun install 自动走 frozen lockfile。
      - name: Install dependencies
        shell: bash
        run: |
          bun install
          (cd extension && bun install)
          (cd frontend && bun install)

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      # v0.2.0 → version: "0.2.0"。sed -i.bak 是 GNU/BSD sed（Windows/macOS
      # runner）通吃的可移植写法。
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/version: \".*\"/version: \"${VERSION}\"/" mygo.config.ts
          rm mygo.config.ts.bak
          grep 'version:' mygo.config.ts

      - name: Build
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform ${{ matrix.platforms }}

      # Windows：安装包直接上传，便携版 exe 压成 zip（runner 自带 7z）。
      # 同时收集更新器产物：签名更新包 tar.gz、分平台 manifest、delta 增量
      # （mygo build 产出，官网 Worker 按文件名代理给应用内更新器）。
      # 产物缺失（如 Secrets 未配 MYGO_UPDATER_PRIVATE_KEY）只警告不阻断，
      # 照常发布安装包。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for arch in amd64 arm64; do
            7z a "release/knot-${VERSION}-windows-${arch}-portable.zip" "build/windows-${arch}/Knot.exe" > /dev/null
            cp build/windows-${arch}/knot-setup-*-"${arch}".exe release/
            if [ -f "build/windows-${arch}/update-windows-${arch}.json" ]; then
              # tar.gz 按 mygo.config.ts 的版本命名（tag 构建时 sed 已同步），用 glob
              # 匹配：workflow_dispatch 会跳过版本注入，ref 名是 main，对不上。
              cp build/windows-${arch}/knot-*"-windows-${arch}.tar.gz" release/
              cp "build/windows-${arch}/update-windows-${arch}.json" release/
              cp build/windows-${arch}/knot-*"-to-${VERSION}-windows-${arch}.delta" release/ 2>/dev/null || true
            else
              echo "::warning::未找到更新器产物 update-windows-${arch}.json（Secrets 未配置 MYGO_UPDATER_PRIVATE_KEY？）本次只发布安装包"
            fi
          done
          ls -la release

      # macOS：DMG 直接上传；.app 必须用 ditto 压缩，保留可执行位与资源分支。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          DMG=$(find build -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "未找到 DMG"
            exit 1
          fi
          cp "$DMG" release/
          ditto -c -k --sequesterRsrc --keepParent build/darwin-universal/Knot.app "release/knot-${VERSION}-macos-universal.zip"
          if [ -f "build/darwin-universal/update-darwin-universal.json" ]; then
            cp build/darwin-universal/knot-*"-darwin-universal.tar.gz" release/
            cp "build/darwin-universal/update-darwin-universal.json" release/
            cp build/darwin-universal/knot-*"-to-${VERSION}-darwin-universal.delta" release/ 2>/dev/null || true
          else
            echo "::warning::未找到更新器产物 update-darwin-universal.json（Secrets 未配置 MYGO_UPDATER_PRIVATE_KEY？）本次只发布安装包"
          fi
          ls -la release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: knot-*
          path: dist
          merge-multiple: true

      # 显式扁平化：不依赖 artifact 内部目录结构。
      - name: Collect assets
        run: |
          mkdir assets
          find dist -type f -exec cp {} assets/ \;
          ls -la assets

      - name: Generate checksums
        working-directory: assets
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Knot ${{ github.ref_name }}
          files: assets/*
          generate_release_notes: true
