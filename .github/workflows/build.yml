name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 双平台矩阵：Windows exe + NSIS 安装包，macOS .app + DMG。
# 签名/公证需要证书与密钥，配置好 secrets 后自动启用。
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platforms: windows/amd64,windows/arm64
          - os: macos-latest
            platforms: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform ${{ matrix.platforms }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knot-${{ matrix.os }}
          path: |
            build/
            !build/**/*.pdb
          if-no-files-found: error
